services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmalytics
      POSTGRES_PASSWORD: pharmalytics_dev
      POSTGRES_DB: pharmalytics
    ports:
      - "5432:5432"
    volumes:
      - pharmalytics_db_dev:/var/lib/postgresql/data

volumes:
  pharmalytics_db_dev:
